{% extends "base.html" %}

{% block titulo %}Login - TriX{% endblock %}

{% block conteudo %}
<section class="centralizar-texto tela-login">
    <img src="{{ url_for('static', filename='img/logo-trix.png') }}" alt="TriX" width="120">
    <h2>Acesso ao TriX</h2>
    <p class="texto-destaque">Escolha o perfil antes de entrar no sistema.</p>

    {% if mensagem_erro %}
    <p class="texto-vermelho">{{ mensagem_erro }}</p>
    {% endif %}

    <article class="meu-formulario">
        <form action="{{ url_for('principal.entrar_no_sistema') }}" method="post">
            <label for="login">Usuário</label>
            <input type="text" id="login" name="login" required placeholder="Ex: admin ou dra.ana">

            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required placeholder="********">

            <label for="perfil">Perfil de Acesso</label>
            <select id="perfil" name="perfil" required>
                <option value="">Selecione...</option>
                <option value="medico">Profissional de Saúde</option>
                <option value="administrador">Administrador</option>
            </select>

            <button type="submit">Entrar</button>
        </form>
    </article>
</section>
{% endblock %}
